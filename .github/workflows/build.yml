name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1

      - name: Test policy and build release APK
        run: gradle --no-daemon :policy-tests:test :app:assembleRelease

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: policy-tests/build/test-results/test/*.xml
          if-no-files-found: warn

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/OPlusFluidCompat.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OPlusFluidCompat-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ci-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/OPlusFluidCompat.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "OPlusFluidCompat CI $GITHUB_RUN_NUMBER" --notes "Automated test build from $GITHUB_SHA" --prerelease
